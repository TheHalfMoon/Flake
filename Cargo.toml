[package]
name = "fehrest"
version = "0.0.1-phase-t"
edition = "2021"
rust-version = "1.97"
description = "Fehrest Phase T — headless Rust thesis-proof. Experimental; not a product."
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
rusqlite = { version = "0.37", default-features = false, features = ["bundled", "backup"] }
uuid = { version = "1", default-features = false, features = ["v7", "std"] }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "fehrest"
path = "src/main.rs"

[[bin]]
name = "fehrest-bench-v0"
path = "bench/V0/harness.rs"

[[bin]]
name = "fehrest-r1"
path = "bench/R1/harness/main.rs"
