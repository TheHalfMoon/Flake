[package]
name = "fehrest"
version = "0.0.1-phase-t"
edition = "2021"
rust-version = "1.97"
description = "Fehrest Phase T — headless Rust thesis-proof. Experimental; not a product."
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
rusqlite = { version = "0.37", default-features = false, features = ["bundled", "backup"] }
uuid = { version = "1", default-features = false, features = ["v7", "std"] }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "fehrest"
path = "src/main.rs"

# `T05-03` (plan section 25: "`flake` is the new product command... A
# compatibility alias, if shipped, must call the same new implementation...
# no hidden behavior fork"). This is deliberately the exact same
# `src/main.rs` as `fehrest` above, not a wrapper or re-export -- the two
# binaries are byte-for-byte the same compiled program under two shipped
# names, so "no hidden behavior fork" holds trivially, not by convention.
# `flake` is the name shipped in release archives/installers going
# forward; `fehrest` remains built and shipped alongside it as the
# preserved historical/compatibility name, per that same section.
[[bin]]
name = "flake"
path = "src/main.rs"

[[bin]]
name = "fehrest-bench-v0"
path = "bench/V0/harness.rs"

[[bin]]
name = "fehrest-r1"
path = "bench/R1/harness/main.rs"
